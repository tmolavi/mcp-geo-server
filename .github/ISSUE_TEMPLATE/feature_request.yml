name: Feature request
description: Suggest an idea or new MCP tool capability
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: Clear explanation of proposed tool or protocol capability
      placeholder: Describe the feature...
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Problem Solved
      description: What agent workflow does this support?
    validations:
      required: true
