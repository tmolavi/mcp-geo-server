[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-geo-server"
version = "0.2.0"
description = "Model Context Protocol (MCP) Server for SAGE SEO, Entity AEO, and Generative Engine Optimization (GEO)"
readme = "README.md"
authors = [{ name = "Taqi Molavi", email = "info@molavi.pro" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0"
]
requires-python = ">=3.10"

[project.optional-dependencies]
sage = [
    "sage-audit>=1.0.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
mcp-geo-server = "mcp_geo_server.server:main"

[project.urls]
Homepage = "https://molavi.pro/research/geo-pyramid"
Repository = "https://github.com/tmolavi/mcp-geo-server"
Issues = "https://github.com/tmolavi/mcp-geo-server/issues"

[tool.setuptools.packages.find]
where = ["src"]
